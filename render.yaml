# Render Deployment Blueprint for Job & Internship Portal
# Project Owner: Indra Singh Jeena (B.Tech CSE Minor Project 2026–27)

services:
  # 1. Backend REST API (Web Service)
  - type: web
    name: job-portal-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: ALLOW_IN_MEMORY_DB
        value: false

  # 2. Frontend React Client (Static Site)
  - type: web
    name: job-portal-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
